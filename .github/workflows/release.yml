name: Build & Publish Release (to public releases repo)

on:
  push:
    tags:
      - 'v*'          # trigger on tags like v1.2.3

permissions:
  contents: write   # required by the release action

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build installers (electron-builder)
        # We pass --publish never so electron-builder doesn't try to publish itself.
        # We still get the artifacts + metadata (latest.yml) in the output dir.
        run: npx electron-builder --publish never

      - name: Create or update release in public repo & upload assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          # target repository that will hold the Releases
          repository: nmitic/perunio-facturador-release
          # files to upload (adjust globs to your actual output)
          files: |
            dist/*.exe
          # use the PAT stored in secrets
          token: ${{ secrets.RELEASES_PAT }}
